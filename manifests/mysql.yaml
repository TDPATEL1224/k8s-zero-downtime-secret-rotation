# CLO835 Project 12 - MySQL data tier (student 105823249)
# PVC (data survives Pod restart) + Deployment (plain mysql:8.0) + ClusterIP Service
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-105823249
  namespace: rotation-105823249
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-105823249
  namespace: rotation-105823249
  labels:
    app: mysql-105823249
spec:
  replicas: 1
  strategy:
    type: Recreate          # never two MySQL Pods on the same data at once
  selector:
    matchLabels:
      app: mysql-105823249
  template:
    metadata:
      labels:
        app: mysql-105823249
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            # Root password comes from a Secret created by the scripts, never from git.
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root-105823249
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data-105823249
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-105823249
  namespace: rotation-105823249
spec:
  type: ClusterIP
  selector:
    app: mysql-105823249
  ports:
    - port: 3306
      targetPort: 3306